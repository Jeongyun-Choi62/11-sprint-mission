spring:
  application:
    name: discodeit

  profiles:
    active: dev

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true


logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE



discodeit:
  storage:
    type: local
    local:
      root-path: /tmp/discodeit

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  info:
    env:
      enabled: true # info 블록의 모든 값을 보기 위한 설정

info:
  app:
    name: discodeit
    version: 1.8.0
  java:
    version: 17
  spring-boot:
    version: 3.5.11