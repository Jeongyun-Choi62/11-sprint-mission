spring:
  application:
    name: discodeit

  profiles:
    active: dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
      show-sql: false
      properties:
        hibernate:
          format_sql: true
          use_sql_comments: true



  logging:
    level:
      org.hibernate.SQL: INFO
      org.hibernate.orm.jdbc.bind: INFO


discodeit:
  storage:
    type: local
    local:
      root-path: /tmp/discodeit

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: '*'
        exclude: ''